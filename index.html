<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PastrelCraft 🌿 — Apprentissage Doux & TDAH</title>
  
  <!-- 1. CHARGEMENT DES BIBLIOTHÈQUES (CDN) -->
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Configuration des polices et styles spécifiques TDAH / Pastel -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap');
    body {
      font-family: 'Lexend', sans-serif;
      background-color: #fafaf9;
    }
  </style>
</head>
<body class="text-stone-700 min-h-screen">

  <div id="root"></div>

  <!-- 2. CODE REACT / JAVASCRIPT DE PASTRELCRAFT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function PastrelCraft() {
      // ----------------------------------------
      // A. ÉTATS (STATE)
      // ----------------------------------------
      const [activeTab, setActiveTab] = useState('study-cards');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('pastrelcraft_gemini_key') || '');
      const [xp, setXp] = useState(() => Number(localStorage.getItem('pastrelcraft_xp')) || 0);
      const [streak, setStreak] = useState(() => Number(localStorage.getItem('pastrelcraft_streak')) || 0);
      const [hideDistractions, setHideDistractions] = useState(false);

      const [decks, setDecks] = useState([
        {
          id: 'demo-botanique',
          title: 'Botanique & Phytothérapie',
          description: 'Plantes médicinales, principes actifs et propriétés.',
          cards: [
            { id: 'c1', question: 'Quelle est la propriété majeure du Millepertuis (Hypericum perforatum) ?', answer: 'Antidépresseur léger à modéré, anxiolytique (Attention aux interactions CYP3A4).', image: '', status: 'new', reviewCount: 0 },
            { id: 'c2', question: 'Quel principe actif donne la couleur jaune/orange au Curcuma ?', answer: 'Les curcuminoïdes (puissants antioxydants et anti-inflammatoires).', image: '', status: 'new', reviewCount: 0 },
            { id: 'c3', question: 'Quelle est la différence entre une tisane et une décoction ?', answer: 'L infusion consiste à verser l eau bouillante sur les parties tendres (fleurs/feuilles). La décoction fait bouillir les parties dures (racines/écorces).', image: '', status: 'new', reviewCount: 0 }
          ]
        }
      ]);
      const [selectedDeckId, setSelectedDeckId] = useState('demo-botanique');

      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [instantQuiz, setInstantQuiz] = useState(null);
      const [instantQuizLoading, setInstantQuizLoading] = useState(false);

      const [sheetUrl, setSheetUrl] = useState('');
      const [sheetLoading, setSheetLoading] = useState(false);
      const [sheetError, setSheetError] = useState('');
      const [sheetHeaders, setSheetHeaders] = useState([]);
      const [sheetRows, setSheetRows] = useState([]);
      const [selectedRectoCol, setSelectedRectoCol] = useState(0);
      const [selectedVersoCol, setSelectedVersoCol] = useState(1);
      const [selectedImgCol, setSelectedImgCol] = useState(-1);

      const currentDeck = decks.find(d => d.id === selectedDeckId) || decks[0];

      // ----------------------------------------
      // B. FONCTIONS AUXILIAIRES & GAINS D'XP
      // ----------------------------------------
      const playSound = (isGood) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = isGood ? 523.25 : 220;
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      };

      const addReward = (isGood) => {
        playSound(isGood);
        if (isGood) {
          const newXp = xp + 10;
          const newStreak = streak + 1;
          setXp(newXp);
          setStreak(newStreak);
          localStorage.setItem('pastrelcraft_xp', newXp.toString());
          localStorage.setItem('pastrelcraft_streak', newStreak.toString());
        } else {
          setStreak(0);
          localStorage.setItem('pastrelcraft_streak', '0');
        }
      };

      // ----------------------------------------
      // C. PARSER & IMPORTATION GOOGLE SHEET
      // ----------------------------------------
      const parseCSVLine = (line) => {
        let result = [], cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
          else cur += char;
        }
        result.push(cur.trim());
        return result;
      };

      const handleAnalyzeSheet = async (e) => {
        e.preventDefault();
        if (!sheetUrl.trim()) return;
        setSheetLoading(true);
        setSheetError('');

        try {
          const matches = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (!matches || !matches[1]) throw new Error("Impossible de lire l'URL du Google Sheet. Assurez-vous qu'il est partagé en public.");
          
          const docId = matches[1];
          const gidMatch = sheetUrl.match(/[?&]gid=(\d+)/);
          const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : '';
          const csvUrl = `https://docs.google.com/spreadsheets/d/${docId}/export?format=csv${gidParam}`;

          const res = await fetch(csvUrl);
          if (!res.ok) throw new Error("Impossible de télécharger le fichier. Vérifiez les accès de partage.");
          const text = await res.text();
          const lines = text.split('\n').filter(line => line.trim() !== '');

          if (lines.length < 2) throw new Error("Le tableau ne contient pas assez de données.");

          const headers = parseCSVLine(lines[0]);
          setSheetHeaders(headers);
          setSheetRows(lines.slice(1));

          const headersLower = headers.map(h => h.toLowerCase());
          const qIdx = headersLower.findIndex(h => h.includes('question') || h.includes('recto') || h.includes('q'));
          const aIdx = headersLower.findIndex(h => h.includes('reponse') || h.includes('réponse') || h.includes('verso') || h.includes('r'));
          const imgIdx = headersLower.findIndex(h => h.includes('image') || h.includes('photo'));

          setSelectedRectoCol(qIdx !== -1 ? qIdx : 0);
          setSelectedVersoCol(aIdx !== -1 ? aIdx : (headers.length > 1 ? 1 : 0));
          setSelectedImgCol(imgIdx);

        } catch (err) {
          setSheetError(err.message);
        } finally {
          setSheetLoading(false);
        }
      };

      const handleConfirmImport = () => {
        if (!sheetRows.length) return;
        const importedCards = [];

        for (let i = 0; i < sheetRows.length; i++) {
          const cols = parseCSVLine(sheetRows[i]);
          const rectoVal = cols[selectedRectoCol]?.replace(/^"|"$/g, '') || '';
          const versoVal = cols[selectedVersoCol]?.replace(/^"|"$/g, '') || '';
          const imgVal = selectedImgCol >= 0 ? cols[selectedImgCol]?.replace(/^"|"$/g, '') : '';

          if (rectoVal && versoVal) {
            importedCards.push({
              id: `sheet_c_${Date.now()}_${i}`,
              question: rectoVal,
              answer: versoVal,
              image: imgVal,
              status: 'new',
              reviewCount: 0
            });
          }
        }

        if (importedCards.length === 0) {
          setSheetError("Aucune carte n'a pu être créée à partir des colonnes choisies.");
          return;
        }

        const updatedDecks = decks.map(deck => {
          if (deck.id === selectedDeckId) {
            return { ...deck, cards: [...deck.cards, ...importedCards] };
          }
          return deck;
        });

        setDecks(updatedDecks);
        setSheetUrl('');
        setSheetHeaders([]);
        setSheetRows([]);
        setActiveTab('study-cards');
      };

      // ----------------------------------------
      // D. CALCULS DES STATISTIQUES & PROGRESSION
      // ----------------------------------------
      const totalCards = currentDeck ? currentDeck.cards.length : 0;
      const cardsSeen = currentDeck ? currentDeck.cards.filter(c => c.status !== 'new').length : 0;
      const cardsMastered = currentDeck ? currentDeck.cards.filter(c => c.status === 'mastered').length : 0;
      
      const percentSeen = totalCards > 0 ? Math.round((cardsSeen / totalCards) * 100) : 0;
      const percentMastered = totalCards > 0 ? Math.round((cardsMastered / totalCards) * 100) : 0;

      const handleUpdateCardStatus = (cardId, masteryLevel) => {
        const isGood = masteryLevel === 'easy';
        addReward(isGood);

        const updatedDecks = decks.map(deck => {
          if (deck.id === selectedDeckId) {
            const updatedCards = deck.cards.map(card => {
              if (card.id === cardId) {
                let newStatus = 'reviewing';
                if (masteryLevel === 'easy') newStatus = 'mastered';
                if (masteryLevel === 'hard') newStatus = 'hard';
                return { ...card, reviewCount: (card.reviewCount || 0) + 1, status: newStatus };
              }
              return card;
            });
            return { ...deck, cards: updatedCards };
          }
          return deck;
        });

        setDecks(updatedDecks);

        if (currentCardIndex < currentDeck.cards.length - 1) {
          setCurrentCardIndex(prev => prev + 1);
          setIsFlipped(false);
          setInstantQuiz(null);
        }
      };

      const handleGenerateInstantQuiz = async () => {
        const currentCard = currentDeck.cards[currentCardIndex];
        if (!currentCard) return;

        setInstantQuizLoading(true);
        setInstantQuiz(null);

        if (apiKey) {
          try {
            const prompt = `Génère 3 fausses réponses (distracteurs) crédibles mais distinctes pour la question suivante : "${currentCard.question}". Bonne réponse : "${currentCard.answer}". Envoie un JSON au format strict : { "distractors": ["fausse1", "fausse2", "fausse3"] }`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-preview:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await res.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const parsed = JSON.parse(rawText.replace(/```json|```/g, ''));
            
            const allOpts = [currentCard.answer, ...parsed.distractors.slice(0, 3)];
            const shuffled = allOpts.sort(() => Math.random() - 0.5);

            setInstantQuiz({
              cardId: currentCard.id,
              question: currentCard.question,
              correctAnswer: currentCard.answer,
              options: shuffled,
              selected: null,
              submitted: false
            });
          } catch (e) {
            console.error(e);
            generateFallbackQuiz(currentCard);
          } finally {
            setInstantQuizLoading(false);
          }
        } else {
          generateFallbackQuiz(currentCard);
          setInstantQuizLoading(false);
        }
      };

      const generateFallbackQuiz = (card) => {
        const otherAnswers = currentDeck.cards.filter(c => c.id !== card.id).map(c => c.answer);
        const distractors = [];
        while (distractors.length < 3 && otherAnswers.length > 0) {
          const randIdx = Math.floor(Math.random() * otherAnswers.length);
          distractors.push(otherAnswers.splice(randIdx, 1)[0]);
        }
        const options = [card.answer, ...distractors].sort(() => Math.random() - 0.5);
        setInstantQuiz({
          cardId: card.id,
          question: card.question,
          correctAnswer: card.answer,
          options,
          selected: null,
          submitted: false
        });
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // ----------------------------------------
      // E. RENDU DE L'INTERFACE UTILISATEUR (JSX)
      // ----------------------------------------
      return (
        <div class="max-w-3xl mx-auto px-4 py-6">
          
          {/* EN-TÊTE : Titre + Récompenses XP + Mode Zen */}
          {!hideDistractions && (
            <header class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xl">
                  🌿
                </div>
                <div>
                  <h1 class="text-xl font-bold text-stone-800">PastrelCraft</h1>
                  <p class="text-xs text-stone-500">Apprentissage doux & sur-mesure</p>
                </div>
              </div>

              {/* Badges de Gamification TDAH */}
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 text-amber-700 rounded-full text-xs font-semibold border border-amber-200">
                  ⚡ <span>{xp} XP</span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-50 text-rose-700 rounded-full text-xs font-semibold border border-rose-200">
                  🔥 <span>{streak} d affilée</span>
                </div>
                <button 
                  onClick={() => setHideDistractions(true)} 
                  class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-full text-xs transition-colors"
                  title="Activer le mode Zen sans distraction"
                >
                  🧘 Mode Zen
                </button>
              </div>
            </header>
          )}

          {/* Bouton pour quitter le mode Zen */}
          {hideDistractions && (
            <div class="flex justify-end mb-4">
              <button 
                onClick={() => setHideDistractions(false)}
                class="px-3 py-1 bg-white border border-stone-200 text-stone-600 rounded-full text-xs shadow-sm hover:bg-stone-50"
              >
                👁️ Revenir au mode normal
              </button>
            </div>
          )}

          {/* SELECTEUR DE PAQUET DE CARTES */}
          <div class="mb-6 bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-emerald-900">Paquet actif :</span>
              <select 
                value={selectedDeckId} 
                onChange={(e) => { setSelectedDeckId(e.target.value); setCurrentCardIndex(0); setIsFlipped(false); }}
                class="bg-white border border-emerald-200 rounded-lg px-3 py-1.5 text-sm font-medium text-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-400"
              >
                {decks.map(deck => (
                  <option key={deck.id} value={deck.id}>{deck.title} ({deck.cards.length} cartes)</option>
                ))}
              </select>
            </div>
          </div>

          {/* BARRE DE NAVIGATION PRINCIPALE */}
          <nav class="flex border-b border-stone-200 mb-6 gap-2 overflow-x-auto pb-1">
            <button 
              onClick={() => setActiveTab('study-cards')}
              class={`px-4 py-2.5 rounded-t-xl text-sm font-medium flex items-center gap-2 transition-all ${activeTab === 'study-cards' ? 'bg-white text-emerald-800 border-t-2 border-emerald-500 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}
            >
              🎴 Réviser (Cards)
            </button>

            <button 
              onClick={() => setActiveTab('study-qcm')}
              class={`px-4 py-2.5 rounded-t-xl text-sm font-medium flex items-center gap-2 transition-all ${activeTab === 'study-qcm' ? 'bg-white text-emerald-800 border-t-2 border-emerald-500 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}
            >
              ❓ Réviser (QCM)
            </button>

            <button 
              onClick={() => setActiveTab('import-sheet')}
              class={`px-4 py-2.5 rounded-t-xl text-sm font-medium flex items-center gap-2 transition-all ${activeTab === 'import-sheet' ? 'bg-white text-emerald-800 border-t-2 border-emerald-500 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}
            >
              📊 Importer Sheet
            </button>
          </nav>

          {/* ONGLET 1 : RÉVISION EN FLASHCARDS */}
          {activeTab === 'study-cards' && (
            <div>
              {/* SECTION STATISTIQUES */}
              <div class="bg-white p-4 rounded-xl border border-stone-200 mb-6 shadow-sm">
                <div class="flex justify-between items-center text-xs font-semibold text-stone-600 mb-2">
                  <span>Progression globale : {percentSeen}% vu</span>
                  <span class="text-emerald-600">{percentMastered}% maîtrisé</span>
                </div>
                <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden flex">
                  <div class="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${percentMastered}%` }} title="Maîtrisé"></div>
                  <div class="h-full bg-amber-300 transition-all duration-300" style={{ width: `${percentSeen - percentMastered}%` }} title="En cours"></div>
                </div>
                <div class="flex justify-between text-[11px] text-stone-400 mt-1.5">
                  <span>Carte {currentCardIndex + 1} sur {totalCards}</span>
                  <span>{cardsMastered} maîtrisées / {totalCards - cardsSeen} non vues</span>
                </div>
              </div>

              {currentDeck.cards.length === 0 ? (
                <div class="text-center py-12 bg-white rounded-2xl border border-stone-200">
                  <p class="text-stone-500 mb-4">Ce paquet ne contient aucune carte pour le moment.</p>
                  <button onClick={() => setActiveTab('import-sheet')} class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-medium">Importer des cartes</button>
                </div>
              ) : (
                <div>
                  {(() => {
                    const card = currentDeck.cards[currentCardIndex];
                    if (!card) return null;

                    return (
                      <div>
                        {/* CARTE FLASHCARD */}
                        <div 
                          onClick={() => setIsFlipped(!isFlipped)}
                          class="min-h-[260px] bg-white border border-stone-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between relative overflow-hidden group"
                        >
                          <div class="flex justify-between items-center text-xs">
                            <span class="text-stone-400 font-medium">{isFlipped ? 'VERSO (Réponse)' : 'RECTO (Question)'}</span>
                            <span class={`px-2.5 py-0.5 rounded-full text-[11px] font-medium ${
                              card.status === 'mastered' ? 'bg-emerald-100 text-emerald-800' :
                              card.status === 'reviewing' ? 'bg-amber-100 text-amber-800' :
                              'bg-stone-100 text-stone-600'
                            }`}>
                              {card.status === 'mastered' ? '🟢 Maîtrisée' : card.status === 'reviewing' ? '🟡 À revoir' : '⚪ Non vue'}
                            </span>
                          </div>

                          <div class="my-auto py-4 text-center">
                            {card.image && (
                              <img src={card.image} alt="Illustration" class="max-h-40 mx-auto rounded-lg mb-4 object-contain" />
                            )}
                            <p class={`text-lg font-medium leading-relaxed ${isFlipped ? 'text-emerald-900' : 'text-stone-800'}`}>
                              {isFlipped ? card.answer : card.question}
                            </p>
                          </div>

                          <div class="text-center text-xs text-stone-400 group-hover:text-stone-600 transition-colors">
                            👆 Cliquer pour retourner la carte
                          </div>
                        </div>

                        {/* BOUTONS D'ÉVALUATION */}
                        <div class="mt-4 flex flex-wrap gap-3 justify-between items-center">
                          <button 
                            onClick={handleGenerateInstantQuiz}
                            disabled={instantQuizLoading}
                            class="px-3.5 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-semibold border border-purple-200 transition-colors flex items-center gap-1.5"
                          >
                            {instantQuizLoading ? '⏳ Génération...' : '❓ Hésitation ? Passer en QCM'}
                          </button>

                          {isFlipped && (
                            <div class="flex gap-2">
                              <button 
                                onClick={() => handleUpdateCardStatus(card.id, 'hard')}
                                class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-xs font-semibold border border-rose-200"
                              >
                                🔴 À revoir
                              </button>
                              <button 
                                onClick={() => handleUpdateCardStatus(card.id, 'easy')}
                                class="px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-semibold border border-emerald-200"
                              >
                                🟢 Acquis / Facile
                              </button>
                            </div>
                          )}
                        </div>

                        {/* QCM INSTANTANÉ */}
                        {instantQuiz && (
                          <div class="mt-6 p-5 bg-purple-50/80 rounded-2xl border border-purple-200">
                            <h3 class="text-sm font-bold text-purple-900 mb-3">QCM Instantané de secours :</h3>
                            <p class="text-sm text-stone-800 mb-3">{instantQuiz.question}</p>
                            <div class="space-y-2">
                              {instantQuiz.options.map((opt, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => {
                                    setInstantQuiz({ ...instantQuiz, selected: opt, submitted: true });
                                    addReward(opt === instantQuiz.correctAnswer);
                                  }}
                                  disabled={instantQuiz.submitted}
                                  class={`w-full text-left p-3 rounded-xl text-sm transition-all border ${
                                    instantQuiz.submitted
                                      ? opt === instantQuiz.correctAnswer
                                        ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-medium'
                                        : opt === instantQuiz.selected
                                        ? 'bg-rose-100 border-rose-300 text-rose-900'
                                        : 'bg-white border-stone-200 opacity-60'
                                      : 'bg-white border-purple-100 hover:border-purple-300 text-stone-800'
                                  }`}
                                >
                                  {opt}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
              )}
            </div>
          )}

          {/* ONGLET 2 : MODE QCM */}
          {activeTab === 'study-qcm' && (
            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
              <h2 class="text-base font-bold text-stone-800 mb-4">Mode Révision QCM</h2>
              <p class="text-xs text-stone-500 mb-6">Testez vos connaissances sous forme de choix multiples générés à partir de vos fiches.</p>
              
              {currentDeck.cards.length < 2 ? (
                <p class="text-sm text-stone-500">Il faut au moins 2 cartes dans le paquet pour pouvoir générer un QCM.</p>
              ) : (
                <button 
                  onClick={handleGenerateInstantQuiz}
                  class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm shadow-sm transition-colors"
                >
                  🎲 Générer une question QCM aléatoire
                </button>
              )}
            </div>
          )}

          {/* ONGLET 3 : IMPORTATION GOOGLE SHEET */}
          {activeTab === 'import-sheet' && (
            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-6">
              <div>
                <h2 class="text-base font-bold text-stone-800 mb-1">Importer depuis Google Sheets</h2>
                <p class="text-xs text-stone-500">Collez le lien public de votre tableau Google Sheet pour ajouter vos cartes.</p>
              </div>

              <form onSubmit={handleAnalyzeSheet} class="space-y-3">
                <input 
                  type="url" 
                  placeholder="https://docs.google.com/spreadsheets/d/..."
                  value={sheetUrl}
                  onChange={(e) => setSheetUrl(e.target.value)}
                  class="w-full px-4 py-2.5 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"
                  required
                />
                <button 
                  type="submit" 
                  disabled={sheetLoading}
                  class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition-colors"
                >
                  {sheetLoading ? '⏳ Analyse...' : '🔍 Analyser le tableau'}
                </button>
              </form>

              {sheetError && (
                <p class="text-xs text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">{sheetError}</p>
              )}

              {sheetHeaders.length > 0 && (
                <div class="pt-4 border-t border-stone-100 space-y-4">
                  <h3 class="text-sm font-bold text-stone-800">Choisissez le rôle des colonnes :</h3>
                  
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label class="block text-xs font-medium text-stone-600 mb-1">📤 Recto (Question)</label>
                      <select 
                        value={selectedRectoCol} 
                        onChange={(e) => setSelectedRectoCol(Number(e.target.value))}
                        class="w-full p-2 border border-stone-200 rounded-lg text-sm"
                      >
                        {sheetHeaders.map((h, idx) => <option key={idx} value={idx}>{h}</option>)}
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-medium text-stone-600 mb-1">📥 Verso (Réponse)</label>
                      <select 
                        value={selectedVersoCol} 
                        onChange={(e) => setSelectedVersoCol(Number(e.target.value))}
                        class="w-full p-2 border border-stone-200 rounded-lg text-sm"
                      >
                        {sheetHeaders.map((h, idx) => <option key={idx} value={idx}>{h}</option>)}
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-medium text-stone-600 mb-1">🖼️ Image (Optionnel)</label>
                      <select 
                        value={selectedImgCol} 
                        onChange={(e) => setSelectedImgCol(Number(e.target.value))}
                        class="w-full p-2 border border-stone-200 rounded-lg text-sm"
                      >
                        <option value={-1}>Aucune</option>
                        {sheetHeaders.map((h, idx) => <option key={idx} value={idx}>{h}</option>)}
                      </select>
                    </div>
                  </div>

                  <button 
                    onClick={handleConfirmImport}
                    class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm shadow-sm transition-colors"
                  >
                    ✅ Valider et importer {sheetRows.length} cartes
                  </button>
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PastrelCraft />);
  </script>
</body>
</html>
